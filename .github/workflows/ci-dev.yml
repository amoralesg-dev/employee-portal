name: CI CD EMPLOYEE-PORTAL DEV

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build Employee Portal
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validar versiones
        run: |
          java -version
          mvn -version

      - name: Compilar y ejecutar tests
        run: mvn clean verify -Dspring.profiles.active=test -e

      - name: Subir reportes Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Normalizar nombre del JAR
        shell: bash
        run: |
          SOURCE_JAR=$(find target \
            -maxdepth 1 \
            -type f \
            -name "employee-portal-*.jar" \
            ! -name "*.jar.original" \
            | head -n 1)

          if [ -z "$SOURCE_JAR" ]; then
            echo "No se encontro el JAR ejecutable."
            exit 1
          fi

          cp "$SOURCE_JAR" target/employee-portal.jar

          echo "JAR generado:"
          ls -lh target/employee-portal.jar

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-jar
          path: target/employee-portal.jar
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy Employee Portal DEV
    needs: build

    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on:
      - self-hosted
      - Windows
      - X64
      - backend
      - employee-portal
      - dev

    steps:
      - name: Preparar carpeta temporal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $deployPath = 'C:\deploy\employee-portal'

          if (-not (Test-Path $deployPath)) {
            New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
          }

          Get-ChildItem -Path $deployPath -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host "Carpeta preparada: $deployPath"

      - name: Descargar JAR generado
        uses: actions/download-artifact@v4
        with:
          name: employee-portal-jar
          path: C:\deploy\employee-portal

      - name: Validar archivos requeridos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceJar = 'C:\deploy\employee-portal\employee-portal.jar'
          $startScript = 'C:\apps\employee-portal\start-employee-portal.bat'
          $envScript = 'C:\apps\employee-portal\config\employee-portal.env.cmd'

          if (-not (Test-Path $sourceJar)) {
            throw "No existe el artifact: $sourceJar"
          }

          if (-not (Test-Path $startScript)) {
            throw "No existe el script de arranque: $startScript"
          }

          if (-not (Test-Path $envScript)) {
            throw "No existe el archivo de ambiente: $envScript"
          }

          $artifact = Get-Item $sourceJar

          if ($artifact.Length -le 0) {
            throw 'El artifact descargado esta vacio.'
          }

          $artifact | Select-Object FullName, Length, LastWriteTime

      - name: Detener servicio DEV
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $serviceName = 'employee-portal-dev'
          $service = Get-Service -Name $serviceName -ErrorAction Stop

          if ($service.Status -ne 'Stopped') {
            Stop-Service -Name $serviceName -Force -ErrorAction Stop
          }

          $maxAttempts = 20

          for ($i = 1; $i -le $maxAttempts; $i++) {
            $service = Get-Service -Name $serviceName -ErrorAction Stop

            Write-Host "Intento $i de $maxAttempts. Estado: $($service.Status)"

            if ($service.Status -eq 'Stopped') {
              Write-Host "Servicio $serviceName detenido correctamente."
              exit 0
            }

            Start-Sleep -Seconds 2
          }

          $service = Get-Service -Name $serviceName -ErrorAction Stop
          throw "El servicio $serviceName no se detuvo. Estado: $($service.Status)"

      - name: Crear backup del JAR actual
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $currentJar = 'C:\apps\employee-portal\employee-portal.jar'
          $backupPath = 'C:\apps\employee-portal\backup'
          $backupName = "employee-portal-$env:GITHUB_RUN_NUMBER.jar"
          $backupJar = Join-Path $backupPath $backupName

          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          if (Test-Path $currentJar) {
            Copy-Item -LiteralPath $currentJar -Destination $backupJar -Force
            Write-Host "Backup generado: $backupJar"
          } else {
            Write-Host 'No existe un JAR anterior para respaldar.'
          }

      - name: Conservar ultimos 6 backups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $backupPath = 'C:\apps\employee-portal\backup'

          $backups = Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-*.jar' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending

          $backups |
            Select-Object -Skip 6 |
            Remove-Item -Force

          Write-Host 'Backups conservados:'

          Get-ChildItem `
            -Path $backupPath `
            -Filter 'employee-portal-*.jar' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object Name, Length, LastWriteTime

      - name: Copiar nuevo JAR
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceJar = 'C:\deploy\employee-portal\employee-portal.jar'
          $targetJar = 'C:\apps\employee-portal\employee-portal.jar'

          if (-not (Test-Path $sourceJar)) {
            throw "No existe el JAR fuente: $sourceJar"
          }

          Copy-Item `
            -LiteralPath $sourceJar `
            -Destination $targetJar `
            -Force `
            -ErrorAction Stop

          if (-not (Test-Path $targetJar)) {
            throw "No existe el JAR desplegado: $targetJar"
          }

          $source = Get-Item $sourceJar
          $target = Get-Item $targetJar

          if ($source.Length -ne $target.Length) {
            throw 'El tamano del JAR desplegado no coincide con el artifact.'
          }

          $sourceHash = (Get-FileHash -Path $sourceJar -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -Path $targetJar -Algorithm SHA256).Hash

          if ($sourceHash -ne $targetHash) {
            throw 'El hash del JAR desplegado no coincide con el artifact.'
          }

          Write-Host 'JAR desplegado correctamente:'
          $target | Select-Object FullName, Length, LastWriteTime
          Write-Host "SHA256: $targetHash"

      - name: Limpiar logs anteriores
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $logsPath = 'C:\apps\employee-portal\logs'
          $stdoutLog = Join-Path $logsPath 'employee-portal.log'
          $stderrLog = Join-Path $logsPath 'employee-portal-error.log'

          New-Item -ItemType Directory -Path $logsPath -Force | Out-Null

          Set-Content -Path $stdoutLog -Value ''
          Set-Content -Path $stderrLog -Value ''

          Write-Host 'Logs anteriores limpiados.'

      - name: Iniciar servicio DEV
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $serviceName = 'employee-portal-dev'
          $service = Get-Service -Name $serviceName -ErrorAction Stop

          if ($service.Status -ne 'Running') {
            Start-Service -Name $serviceName -ErrorAction Stop
          }

          $maxAttempts = 20

          for ($i = 1; $i -le $maxAttempts; $i++) {
            $service = Get-Service -Name $serviceName -ErrorAction Stop

            Write-Host "Intento $i de $maxAttempts. Estado: $($service.Status)"

            if ($service.Status -eq 'Running') {
              Write-Host "Servicio $serviceName en RUNNING."
              exit 0
            }

            Start-Sleep -Seconds 2
          }

          $service = Get-Service -Name $serviceName -ErrorAction Stop
          throw "El servicio $serviceName no quedo en RUNNING. Estado: $($service.Status)"

      - name: Esperar Health DEV
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $url = 'http://127.0.0.1:8083/employee-portal/actuator/health'
          $maxAttempts = 24

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Intento $i de $maxAttempts"

            try {
              $response = Invoke-RestMethod `
                -Uri $url `
                -Method Get `
                -TimeoutSec 15

              $response | ConvertTo-Json -Depth 10

              if ($response.status -eq 'UP') {
                Write-Host 'Employee Portal DEV esta UP.'
                exit 0
              }

              Write-Host "Health respondio con status: $($response.status)"
            }
            catch {
              Write-Host "Health aun no disponible: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          Write-Host 'Employee Portal DEV no alcanzo estado UP.'

          Get-Service -Name 'employee-portal-dev' |
            Format-List Name, Status

          netstat -ano |
            Select-String ':8083'

          $stdoutLog = 'C:\apps\employee-portal\logs\employee-portal.log'
          $stderrLog = 'C:\apps\employee-portal\logs\employee-portal-error.log'

          if (Test-Path $stdoutLog) {
            Write-Host 'Ultimas lineas de stdout:'
            Get-Content $stdoutLog -Tail 100
          }

          if (Test-Path $stderrLog) {
            Write-Host 'Ultimas lineas de stderr:'
            Get-Content $stderrLog -Tail 100
          }

          exit 1
