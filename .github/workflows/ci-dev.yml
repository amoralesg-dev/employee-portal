name: CI CD EMPLOYEE-PORTAL DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build Employee Portal
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validar versiones
        run: |
          java -version
          mvn -version

      - name: Compilar y ejecutar tests
        run: mvn clean verify -Dspring.profiles.active=test -e

      - name: Subir reportes Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Validar JAR generado
        shell: bash
        run: |
          test -f target/employee-portal-0.0.1-SNAPSHOT.jar
          ls -lh target/employee-portal-0.0.1-SNAPSHOT.jar

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-portal-jar
          path: target/employee-portal-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy Employee Portal DEV
    needs: build

    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on:
      - self-hosted
      - Windows
      - X64
      - backend
      - employee-portal
      - dev

    steps:
      - name: Preparar carpeta temporal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $deployPath = "C:\deploy\employee-portal"

          if (-not (Test-Path $deployPath)) {
            New-Item -ItemType Directory -Path $deployPath -Force |
              Out-Null
          }

          Get-ChildItem -Path $deployPath -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host "Carpeta temporal preparada: $deployPath"

      - name: Descargar JAR generado
        uses: actions/download-artifact@v4
        with:
          name: employee-portal-jar
          path: C:\deploy\employee-portal

      - name: Validar artifact descargado
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceJar = "C:\deploy\employee-portal\employee-portal-0.0.1-SNAPSHOT.jar"

          if (-not (Test-Path $sourceJar)) {
            throw "No se encontro el artifact: $sourceJar"
          }

          Get-Item $sourceJar |
            Select-Object FullName, Length, LastWriteTime

      - name: Detener servicio DEV
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $serviceName = "employee-portal-dev"
          $service = Get-Service -Name $serviceName -ErrorAction Stop

          if ($service.Status -ne "Stopped") {
            Stop-Service -Name $serviceName -Force -ErrorAction Stop

            $service.WaitForStatus(
              [System.ServiceProcess.ServiceControllerStatus]::Stopped,
              [TimeSpan]::FromSeconds(45)
            )
          }

          $service.Refresh()

          if ($service.Status -ne "Stopped") {
            throw "El servicio $serviceName no se detuvo."
          }

          Write-Host "Servicio $serviceName detenido correctamente."

      - name: Crear carpeta de backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $backupPath = "C:\apps\employee-portal\backup"

          New-Item -ItemType Directory -Path $backupPath -Force |
            Out-Null

          Write-Host "Carpeta de backup disponible: $backupPath"

      - name: Respaldar JAR actual
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $currentJar = "C:\apps\employee-portal\employee-portal.jar"
          $backupPath = "C:\apps\employee-portal\backup"
          $backupName = "employee-portal-$env:GITHUB_RUN_NUMBER.jar"
          $backupJar = Join-Path $backupPath $backupName

          if (Test-Path $currentJar) {
            Copy-Item `
              -Path $currentJar `
              -Destination $backupJar `
              -Force `
              -ErrorAction Stop

            Write-Host "Backup generado: $backupJar"
          } else {
            Write-Host "No existe un JAR anterior para respaldar."
          }

      - name: Conservar ultimos 6 backups
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $backupPath = "C:\apps\employee-portal\backup"

          $backups = Get-ChildItem `
            -Path $backupPath `
            -Filter "employee-portal-*.jar" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending

          $backups |
            Select-Object -Skip 6 |
            Remove-Item -Force

          Write-Host "Backups conservados:"

          Get-ChildItem `
            -Path $backupPath `
            -Filter "employee-portal-*.jar" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object Name, Length, LastWriteTime

      - name: Copiar nuevo JAR
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceJar = "C:\deploy\employee-portal\employee-portal-0.0.1-SNAPSHOT.jar"
          $targetJar = "C:\apps\employee-portal\employee-portal.jar"

          Copy-Item `
            -Path $sourceJar `
            -Destination $targetJar `
            -Force `
            -ErrorAction Stop

          if (-not (Test-Path $targetJar)) {
            throw "No se copio el JAR al destino: $targetJar"
          }

          Get-Item $targetJar |
            Select-Object FullName, Length, LastWriteTime

      - name: Iniciar servicio DEV
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $serviceName = "employee-portal-dev"

          Start-Service -Name $serviceName -ErrorAction Stop

          $service = Get-Service -Name $serviceName -ErrorAction Stop

          $service.WaitForStatus(
            [System.ServiceProcess.ServiceControllerStatus]::Running,
            [TimeSpan]::FromSeconds(45)
          )

          $service.Refresh()

          if ($service.Status -ne "Running") {
            throw "El servicio $serviceName no quedo en estado RUNNING."
          }

          Write-Host "Servicio $serviceName iniciado correctamente."

      - name: Esperar Health DEV
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $url = "http://127.0.0.1:8083/employee-portal/actuator/health"
          $maxAttempts = 18

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Intento $i de $maxAttempts"

            try {
              tMethod `
                -Uri $url `
                -Method Get `
                -TimeoutSec 10

              $response |
                ConvertTo-Json -Depth 10

              if ($response.status -eq "UP") {
                Write-Host "Employee Portal DEV esta UP."
                exit 0
              }

              Write-Host "Health respondio con status: $($response.status)"
            }
            catch {
              Write-Host "Health aun no disponible: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          Write-Host "Employee Portal DEV no alcanzo estado UP."

          Get-Service -Name "employee-portal-dev" |
            Format-List Name, Status

          netstat -ano |
            Select-String ":8083"

          $stdoutLog = "C:\apps\employee-portal\logs\employee-portal.log"
          $stderrLog = "C:\apps\employee-portal\logs\employee-portal-error.log"

          if (Test-Path $stdoutLog) {
            Write-Host "Ultimas lineas de employee-portal.log:"
            Get-Content $stdoutLog -Tail 100
          }

          if (Test-Path $stderrLog) {
            Write-Host "Ultimas lineas de employee-portal-error.log:"
            Get-Content $stderrLog -Tail 100
          }

          exit 1
