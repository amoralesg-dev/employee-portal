server:
  port: 0

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4205
  security:
    jwt:
      secret: dGVzdF9jwt_secret_key_for_unit_tests_minimum_256_bits_long_123456
      expiration-minutes: 60
    mfa:
      # Llave sintética de 32 bytes (256 bits) en Base64 exclusivamente para tests
      encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

spring:
  datasource:
    url: jdbc:h2:mem:iam_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
