server:
  port: 8083
  servlet:
    session:
      timeout: ${IAM_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${IAM_SESSION_COOKIE_SECURE:true}

app:
  cors:
    allowed-origins:
      - http://10.15.1.37:8080
      - https://rss-cxp-dev.rassini.com
      - http://localhost:4200
      - http://localhost:4205
  security:
    oauth2:
      authorizationserver:
        issuer: ${OIDC_ISSUER:https://rss-cxp-dev.rassini.com/employee-portal}
        login-url: ${OIDC_LOGIN_URL:https://rss-cxp-dev.rassini.com/employee-portal/auth/login}

corporate:
  navigation:
    app-base-urls:
      EMPLOYEE_PORTAL: ${EMPLOYEE_PORTAL_BASE_URL:https://rss-cxp-dev.rassini.com/employee-portal}
      COMUNICACION: ${COMUNICACION_BASE_URL:https://rss-cxp-dev.rassini.com/employee-portal}
      MS_PAGOS: ${MS_PAGOS_BASE_URL:https://rss-cxp-dev.rassini.com/portal-cxp}

portal:
  media:
    path: ${PORTAL_MEDIA_PATH:C:/apps/employee-portal/data/media}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://10.15.1.27:3306/iam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.rassini.employeeportal: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
