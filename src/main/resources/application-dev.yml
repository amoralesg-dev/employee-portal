server:
  port: 8083

app:
  cors:
    allowed-origins:
      - http://10.15.1.37:8080
      - https://rss-cxp-dev.rassini.com
      - http://localhost:4200
      - http://localhost:4205

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://10.15.1.27:3306/iam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

