server:
  port: 8083
  servlet:
    session:
      timeout: ${IAM_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: false

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201
      - http://localhost:4205
      - http://localhost:4206
  security:
    oauth2:
      authorizationserver:
        issuer: ${OIDC_ISSUER:http://localhost:8083/employee-portal}
        login-url: ${OIDC_LOGIN_URL:http://localhost:4200/employee-portal/auth/login}

corporate:
  navigation:
    app-base-urls:
      EMPLOYEE_PORTAL: ${EMPLOYEE_PORTAL_BASE_URL:http://localhost:4200/employee-portal}
      COMUNICACION: ${COMUNICACION_BASE_URL:http://localhost:4200/employee-portal}
      MS_PAGOS: ${MS_PAGOS_BASE_URL:http://localhost:4200/portal-cxp}
      POLIZA_ELECTRONICA: ${POLIZA_ELECTRONICA_BASE_URL:http://localhost:4200/poliza-electronica}

portal:
  media:
    path: ${PORTAL_MEDIA_PATH:C:/workspace/employee-portal/data/media}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/iam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
