spring:
  application:
    name: employee-portal
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

portal:
  media:
    path: ${PORTAL_MEDIA_PATH:./data/media}
    max-size-bytes: 5242880
  home:
    limits:
      secondary-news: 4
      campaigns: 3
      weekly-info: 5
      events: 5
      quick-access: 8
      notices: 5

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_DEV_SECRET_CHANGE_ME_DEV_SECRET_123456789}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY}

  # JPA / Hibernate (común)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

server:
  servlet:
    context-path: /employee-portal

logging:
  file:
    name: logs/employee-portal.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/employee-portal.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 5
      total-size-cap: 500MB
      clean-history-on-start: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Info del proyecto
info:
  app:
    name: Employee Portal
    description: API backend del Portal de Empleados
    version: 1.0.0
