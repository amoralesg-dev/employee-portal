<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employee Portal Access">
    <title>Employee Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen-container active">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="glass-panel login-box">
            <div class="logo-container">
                <div class="logo-icon"><i class="fas fa-fingerprint"></i></div>
            </div>
            <h2>Employee Portal</h2>
            <p class="subtitle">Bienvenido de nuevo, ingresa tus credenciales</p>
            
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user icon"></i>
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                <div id="login-error" class="error-message"></div>
                <button type="submit" class="btn-primary" id="login-btn">
                    <span>Iniciar Sesión</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen-container">
        <aside class="sidebar glass-sidebar">
            <div class="sidebar-header">
                <i class="fas fa-layer-group brand-icon"></i>
                <h2 class="brand-text">Portal</h2>
            </div>
            
            <div class="user-profile">
                <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                <div class="user-details">
                    <h3 id="display-username">Cargando...</h3>
                    <span id="display-email"></span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul id="dynamic-menu" class="menu-list">
                    <!-- Menú dinámico se inyecta aquí -->
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header glass-header">
                <h1 id="page-title">Dashboard</h1>
                <div class="header-actions">
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                </div>
            </header>
            
            <div class="content-area" id="main-content-area">
                <div class="glass-card welcome-card">
                    <div class="card-icon"><i class="fas fa-rocket"></i></div>
                    <h2>¡Hola!</h2>
                    <p>Selecciona una opción en el menú lateral para comenzar a trabajar. Este menú ha sido generado dinámicamente según tus permisos.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
